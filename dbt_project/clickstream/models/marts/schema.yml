version: 2
models:
  - name: stg_events
    columns:
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['view', 'cart', 'remove_from_cart', 'purchase']
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
  - name: fct_sessions
    columns:
      - name: user_session
        data_tests: [unique, not_null]
  - name: fct_funnel_daily
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_date, category_l1]
  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: fct_product_performance
    columns:
      - name: product_id
        data_tests: [unique, not_null]
